<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Apivas - Stroke Awareness Quiz</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- AOS Animations -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style/style.css" />
</head>

<body class="home-page">
  <!-- ===== Preloader ===== -->
  <div class="preloader" id="preloader">
    <div class="loader-logo-wrapper">
      <img src="media/microlab.png" alt="Micro Labs Logo" class="loader-logo" />
    </div>
  </div>

  <!-- ===== Main Container ===== -->
  <div class="main-wrapper">
    <!-- Background Shapes -->
    <div class="bg-shapes">
      <span class="shape shape-1"></span>
      <span class="shape shape-2"></span>
      <span class="shape shape-3"></span>
      <span class="grid-overlay"></span>
      
      <!-- Right side vertically centered heart temporarily hidden
      <img src="media/heart.png" alt="Heart Background" class="side-heart" />
      -->
      
      <!-- Left side vertically centered clock -->
      <img src="media/clock.png" alt="Clock Background" class="side-brain" />
    </div>

    <!-- ===== Top Bar ===== -->
    <div class="top-bar">
      <div class="awareness-tag">
        <i class="fas fa-circle-info"></i>
        <span>Content for patient awareness</span>
      </div>
    </div>

    <!-- ===== Language Selection Screen ===== -->
    <div class="lang-screen-overlay" id="langScreenOverlay">
      <div class="lang-card" data-aos="zoom-in">
        <div class="lang-card-header">
          <div class="lang-logo-wrap">
            <img src="media/microlab.png" alt="Micro Labs" class="lang-logo-img" />
          </div>
          <h2 class="lang-title">Select Language</h2>
        </div>

        <div class="lang-selector-wrap">
          <div class="custom-lang-select-box">
            <select id="languageSelect" class="form-select lang-dropdown" aria-label="Select Language">
              <option value="en" selected>English</option>
              <option value="hi">हिन्दी (Hindi)</option>
              <option value="gu">ગુજરાતી (Gujarati)</option>
            </select>
            <i class="fas fa-chevron-down select-chevron"></i>
          </div>
        </div>

        <div class="lang-actions">
          <button type="button" class="btn-start-quiz lang-confirm-btn" id="confirmLangBtn">
            <span class="btn-text">CONTINUE</span>
            <div class="icon-circle">
              <i class="fas fa-arrow-right"></i>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== Hero Content ===== -->
    <div class="hero-content text-center hero-pending" id="heroContent">
      
      <!-- Sirf Mobile view ke liye chota Clock (Desktop pe hide rahega) -->
      <div class="mobile-organs-row">
        <img src="media/clock.png" alt="Clock" class="mobile-organ-img" />
        <!-- <img src="media/heart.png" alt="Heart" class="mobile-organ-img" /> -->
      </div>

      <!-- NAYA: Health Hero Quiz Ribbon -->
      <div class="quiz-ribbon-wrapper" data-aos="fade-down" data-aos-delay="150">
        <!-- Golden Sparkles (Left) -->
        <div class="sparkle-left"><i class="fas fa-star"></i></div>
        
        <!-- Overlapping Gamepad Icon (AB YE BAHAR HAI, toh cut nahi hoga!) -->
        <div class="ribbon-icon">
          <i class="fas fa-gamepad"></i>
        </div>

        <div class="quiz-ribbon">
          <!-- Ribbon Text -->
          <span class="ribbon-text">HEALTH HERO QUIZ</span>
        </div>
        
        <!-- Golden Sparkles (Right) -->
        <div class="sparkle-right"><i class="fas fa-star"></i></div>
      </div>

      <h1 class="hero-title">
        <!-- NAYA: Background Plus Icon SVG (Thick Rounded Cross) -->
        <svg class="bg-icon-plus" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 10h-5V5a2 2 0 0 0-4 0v5H5a2 2 0 0 0 0 4h5v5a2 2 0 0 0 4 0v-5h5a2 2 0 0 0 0-4z" fill="#E11344"/>
        </svg>
        
        <span id="type-line1"></span><br />
        <span id="type-line2" class="gradient-text"></span>
      </h1>

      <!-- Central Info Box -->
      <div class="info-card" data-aos="zoom-in" data-aos-delay="300">
        <!-- NAYA: Background Wave SVGs -->
        <svg class="bg-wave bg-wave-left" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 20 L20 20 L30 5 L50 35 L60 10 L70 20 L100 20" stroke="rgba(225, 19, 68, 0.15)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        
        <svg class="bg-wave bg-wave-right" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 20 L20 20 L30 5 L50 35 L60 10 L70 20 L100 20" stroke="rgba(225, 19, 68, 0.15)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>

        <!-- NAYA: Background layer jo sirf animated border handle karega -->
        <div class="animated-bg-layer"></div>
        
        <div class="info-row">
          
          <!-- Item 1 -->
          <div class="info-item">
            <span class="info-num">5</span>
            <span class="info-label">SITUATIONS</span>
            <div class="badge-wrapper">
              <div class="bottom-badge icon-pink">
                <i class="fas fa-book-open"></i>
              </div>
            </div>
          </div>
            
          <!-- First Divider -->
          <span class="divider"></span>

          <!-- Item 2 -->
          <div class="info-item">
            <span class="info-num">2</span>
            <span class="info-label">CHOICES</span>
            <div class="badge-wrapper multi-badge">
              <div class="bottom-badge icon-green">
                <i class="fas fa-check"></i>
              </div>
              <div class="bottom-badge icon-red">
                <i class="fas fa-xmark"></i>
              </div>
            </div>
          </div>

        </div>
        
      </div>

      <!-- Disclaimer Text -->
      <p class="disclaimer-text" data-aos="fade-up" data-aos-delay="500">
        This is a public awareness tool that helps to recognize, when emergency action may be needed. It does not provide a medical diagnosis. During an emergency situation immediately call <strong>112/108</strong>.
      </p>

      <!-- CTA Button -->
      <div class="cta-wrapper" data-aos="fade-up" data-aos-delay="700">
        <button class="btn-start-quiz" id="startQuizBtn">
          <span class="btn-text">PLAY QUIZ</span>
          <!-- NAYA: Play icon ek circle me wrapped hai screenshot jaisa -->
          <div class="icon-circle">
            <i class="fas fa-play"></i>
          </div>
        </button>
      </div>

    </div>

    <!-- ===== Footer ===== -->
    <footer class="footer-section">
      <div class="footer-center">
        <span>Initiated by</span>
        <img src="media/microlab.png" alt="Micro Labs" class="footer-logo-img" />
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="script/viewport.js"></script>
  <script src="script/script.js"></script>
</body>

</html>
