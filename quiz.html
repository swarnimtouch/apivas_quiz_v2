<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Apivas - Stroke Awareness Quiz</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- AOS Animations -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style/style.css" />
</head>
<body class="quiz-page">

  <!-- ===== Main Container ===== -->
  <div class="main-wrapper">
    
    <!-- Background Shapes -->
    <div class="bg-shapes">
      <span class="shape shape-1"></span>
      <span class="shape shape-2"></span>
      <span class="shape shape-3"></span>
      <span class="grid-overlay"></span>
    </div>

    <!-- ===== Top Bar ===== -->
    <div class="top-bar">
      <div class="brand-logo">
        <img src="media/logo.png" alt="Apivas" class="brand-logo-img" />
      </div>
      <div class="awareness-tag">
        <i class="fas fa-circle-info"></i>
        <span>Content for patient awareness</span>
      </div>
    </div>

    <!-- ===== Quiz Content (3-Column Layout) ===== -->
    <div class="quiz-content-wrapper">
      
      <!-- Left Side (Symptom + Question) -->
      <div class="left-stage" data-aos="fade-right">
        <div class="quiz-pad-card">
          <span class="pad-clip" aria-hidden="true"></span>

          <div class="balance-loss-card" id="symptomCard">
            <div class="b-icon" id="symptomIcon">B</div>
            <div class="info-text">
              <h4 id="symptomTitle">BALANCE LOSS</h4>
              <span class="pad-divider" aria-hidden="true"></span>
              <p id="symptomText">Sudden loss of balance, dizziness or coordination</p>
            </div>
          </div>

          <div class="question-card">
            <h2 class="quiz-question-title" id="questionTitle">
              Mr Ramesh suddenly experienced loss of balance, dizziness or difficulty coordinating his movements.
            </h2>
          </div>
        </div>
      </div>

      <!-- Center (Video) -->
      <div class="center-stage" data-aos="zoom-in" data-aos-delay="300">
        <!-- ===== Quiz Header ===== -->
        <div class="quiz-header text-center" data-aos="fade-down">
          <div class="level-badge quiz-level-ribbon" id="levelBadge">Level 1 of 5</div>
          <div class="quiz-stepper" id="quizStepper" aria-label="Quiz progress">
            <span class="step-dot active">1</span>
            <span class="step-dot">2</span>
            <span class="step-dot">3</span>
            <span class="step-dot">4</span>
            <span class="step-dot">5</span>
          </div>
          <div class="progress-track quiz-progress-track">
            <div class="progress-bar-fill" id="progressBarFill" style="width: 20%;"></div>
          </div>
        </div>

        <div class="video-stage">
          <video id="quizVideo" autoplay loop playsinline preload="auto">
            <source id="quizVideoSource" src="media/balance.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>
      </div>

      <!-- Right Side Options (Stacked Vertically) -->
      <div class="quiz-actions" id="quizActions" data-aos="fade-left" data-aos-delay="500">
        <div class="options-prompt-banner" aria-hidden="true">
          <i class="fas fa-bullhorn"></i>
          <span>What will you do?</span>
        </div>

        <button class="quiz-btn btn-green" id="btnAllGood">
          <i class="fas fa-check-circle"></i>
          <div class="btn-content">
            <span class="btn-title">All good</span>
            <span class="btn-subtext">Nothing wrong — carry on</span>
          </div>
          <span class="option-character-wrap" aria-hidden="true">
            <img src="media/green.png" alt="" class="option-character-img" />
          </span>
        </button>
        
        <button class="quiz-btn btn-red" id="btnMedicalAttention">
          <i class="fas fa-triangle-exclamation"></i>
          <div class="btn-content">
            <span class="btn-title">Need urgent medical attention</span>
            <span class="btn-subtext">This person needs a hospital</span>
          </div>
          <span class="option-character-wrap" aria-hidden="true">
            <img src="media/red.png" alt="" class="option-character-img" />
          </span>
        </button>
      </div>

    </div>
  </div>

  <!-- ===== Feedback Modal ===== -->
  <div class="feedback-modal" id="feedbackModal">
    <div class="modal-content-box">
      <div class="modal-beacon" id="beaconIcon" aria-hidden="true">
        <span></span>
      </div>

      <img src="media/popup.png" alt="" class="modal-character-img" aria-hidden="true" />

      <div class="modal-ribbon">
        <h3 id="modalTitle"></h3>
        <div class="modal-icon" id="modalIcon" aria-hidden="true">
          <i class="fas fa-xmark"></i>
        </div>
      </div>

      <div class="modal-message-wrap">
        <p id="modalText"></p>
      </div>

      <button class="btn-start-quiz modal-next-btn" id="nextLevelBtn">
        <span class="btn-text">Next Level</span>
        <i class="fas fa-arrow-right"></i>
      </button>

      <div class="modal-shield" aria-hidden="true">
        <i class="fas fa-xmark"></i>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="script/viewport.js"></script>
  <script src="script/quiz.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
</body>
</html>
